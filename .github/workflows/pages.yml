name: Deploy CryptoScope site

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Refresh market data", "Publish daily news brief"]
    types: [completed]
  schedule:
    # Fallback refreshes at 10:15 and 20:45 Asia/Shanghai.
    - cron: "15 2 * * *"
    - cron: "45 12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cryptoscope-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p _site/data
          cp index.html .nojekyll _site/
          cp -R assets _site/
          cp data/daily.json data/news.json data/archive-2026-09-28.json _site/data/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
