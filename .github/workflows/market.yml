name: Refresh market data

on:
  schedule:
    # 09:45 Asia/Shanghai, after the completed UTC day is available.
    - cron: "45 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cryptoscope-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Refresh rankings and project statistics
        run: node scripts/update-market.mjs
      - name: Validate generated data
        run: node scripts/check.mjs
      - name: Publish snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh completed UTC market snapshot"
            git push
          fi
